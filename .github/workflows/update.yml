name: Update Attendance Data

on:
  schedule:
    - cron: '*/30 * * * *' # Auto-updates every 30 minutes
  workflow_dispatch:      # Allows manual trigger from Admin Console / GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch and Parse PDF
        run: node parse-pdf.js

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          # This checks if data.json actually changed. If it didn't, it safely skips committing so it doesn't crash!
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update attendance data" && git push)
