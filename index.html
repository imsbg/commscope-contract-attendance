<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Under Maintenance</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Poppins',sans-serif;
            background:#f1f5f9;
        }

        .card{
            animation:fadeUp .7s ease;
        }

        @keyframes fadeUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .spinner{
            width:80px;
            height:80px;
            border:7px solid #dbeafe;
            border-top:7px solid #0d9488;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        .dot{
            animation:blink 1.5s infinite;
        }

        .dot:nth-child(2){
            animation-delay:.2s;
        }

        .dot:nth-child(3){
            animation-delay:.4s;
        }

        @keyframes blink{
            0%,80%,100%{
                opacity:.2;
            }
            40%{
                opacity:1;
            }
        }
    </style>
</head>

<body>

<div class="min-h-screen flex items-center justify-center px-6">

    <div class="card bg-white rounded-3xl shadow-xl border border-slate-200 max-w-xl w-full p-10 text-center">

        <div class="flex justify-center mb-8">
            <div class="spinner"></div>
        </div>

        <h1 class="text-4xl font-bold text-slate-800">
            Under Maintenance
        </h1>

        <p class="mt-5 text-slate-600 leading-7 text-lg">
            We are currently updating some attendance data to provide more
            accurate information.
        </p>

        <p class="mt-3 text-slate-500">
            Please check back again in a few minutes.
        </p>

        <div class="mt-8 inline-flex items-center gap-2 bg-teal-50 text-teal-700 px-5 py-3 rounded-full font-semibold">
            Updating
            <span class="dot">●</span>
            <span class="dot">●</span>
            <span class="dot">●</span>
        </div>

        <div class="mt-10 border-t pt-6">

            <p class="text-slate-500">
                Thank you for your patience.
            </p>

            <p class="mt-2 text-sm text-slate-400">
                © <span id="year"></span> Sandeep Biswal G Apps
            </p>

        </div>

    </div>

</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
